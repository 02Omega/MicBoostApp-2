name: Build APK

# Builds a debug APK on every push to main, and lets you trigger it manually
# from the Actions tab too ("Run workflow" button). No local Android SDK,
# no Android Studio, no specific editor required on your end at all — this
# runs entirely on GitHub's own servers.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicFxBooster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
